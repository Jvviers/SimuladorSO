<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Simulador de Procesos SO</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0; padding: 0;
    }
    header {
      background: #276ef1;
      color: white;
      padding: 12px;
      text-align: center;
    }
    #controls {
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
    }
    /* Formulario de proceso */
    #process-form {
      flex: 1 1 300px;
    }
    #process-form div {
      margin-bottom: 8px;
    }
    #process-form label {
      display: inline-block;
      width: 140px;
    }
    #process-form input {
      width: 160px;
      padding: 4px;
    }
    #process-form button {
      padding: 6px 12px;
      background: #28a745;
      color: white;
      border: none;
      cursor: pointer;
    }
    #process-form button:hover {
      background: #218838;
    }
    /* Lista de procesos */
    #process-list {
      flex: 1 1 300px;
      list-style: none;
      padding: 0;
      margin-top: 24px;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #ddd;
    }
    #process-list li {
      padding: 4px 8px;
      border-bottom: 1px solid #eee;
    }
    /* Configuración de simulación */
    #sim-config {
      flex: 1 1 300px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #sim-config label {
      width: auto;
    }
    #sim-config select,
    #sim-config input {
      width: 120px;
      padding: 4px;
    }
    /* Botones iniciar/detener */
    #sim-buttons {
      flex: 1 1 300px;
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 16px;
    }
    #sim-buttons button {
      padding: 6px 12px;
      border: none;
      cursor: pointer;
      color: white;
    }
    #start-btn { background: #007bff; }
    #stop-btn  { background: #dc3545; }
    #start-btn:hover { background: #0069d9; }
    #stop-btn:hover  { background: #c82333; }

    /* Canvas y charts */
    #canvas, #charts {
      border: 1px solid #ccc;
      margin: 16px;
      height: 240px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Simulador de Procesos SO</h1>
  </header>

  <div id="controls">
    <!-- 1) Formulario de creación de procesos -->
    <form id="process-form">
      <h2>Crear Nuevo Proceso</h2>
      <div>
        <label for="name">Nombre:</label>
        <input type="text" id="name" placeholder="P1" required>
      </div>
      <div>
        <label for="arrival">Llegada (ms):</label>
        <input type="number" id="arrival" min="0" placeholder="0" required>
      </div>
      <div>
        <label for="burst">Burst CPU (ms):</label>
        <input type="number" id="burst" min="1" placeholder="50" required>
      </div>
      <div>
        <label for="memory">Mem. (KB):</label>
        <input type="number" id="memory" min="1" placeholder="128" required>
      </div>
      <button type="submit">Añadir Proceso</button>
    </form>

    <!-- 2) Lista de procesos -->
    <ul id="process-list"></ul>

    <!-- 3) Configuración de simulador -->
    <div id="sim-config">
      <h2>Configuración</h2>
      <div>
        <label for="algo">Algoritmo:</label>
        <select id="algo">
          <option value="SJF">SJF (Shortest Job First)</option>
          <option value="RR">RR (Round Robin)</option>
        </select>
      </div>
      <div>
        <label for="quantum" id="label-quantum" style="display:none;">Quantum (ms):</label>
        <input type="number" id="quantum" min="1" value="5" style="display:none;" />
      </div>
    </div>

    <!-- 4) Botones de simulación -->
    <div id="sim-buttons">
      <button id="start-btn">Iniciar Simulación</button>
      <button id="stop-btn">Detener Simulación</button>
    </div>
  </div>

  <!-- 5) Paneles de salida -->
  <div id="canvas"></div>
  <div id="charts"></div>

  <!-- 6) Módulos ESM -->
  <script type="module" src="../src/ui/controls.js"></script>
  <script type="module" src="../src/renderer/canvas.js"></script>
  <script type="module" src="../src/renderer/charts.js"></script>
</body>
</html>
